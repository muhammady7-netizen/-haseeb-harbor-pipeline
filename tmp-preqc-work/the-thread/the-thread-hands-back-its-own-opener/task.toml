[metadata]
scenario_name = "the_thread_hands_back_its_own_opener"
scenario_description = """=== INTENT ===
Recount the real activity in four named rooms, where the room listing under-reports and the
thread read over-reports, then post the recount into general-meshworks-security and ship
report.md + metrics.json.

=== SHAPE ===
audit a set of figures somebody else produced and restate them (seed shape:
'slack_direct / scheduled-channel-reporting')

=== ACTING USER ===
UDV94ZXBF0PM Stella Alexandra Leblanc, team T0JRMQW0XXCE, token = slack_users.token. The four
rooms are stated in the prompt because they are a fact, not a rule; the method is stated: open every thread that reports replies to see what is underneath it.

=== HIDDEN RULES ===
(what the agent has to work out for itself)
- THE ROOM LISTING IS NOT THE ROOM. conversations.history returns the messages that started a
  thread plus the handful of replies that were broadcast back out - 35 rows across these four
  rooms, against 56 messages actually posted. 31 of the 35 started a thread and 4 are broadcast
  replies, so the listing under-reports the traffic by 21 and over-reports the openers by 4.
- THE THREAD READ HANDS BACK ITS OWN OPENER. conversations.replies returns the parent message
  alongside the replies, so adding up the rows the 17 thread reads return gives 42, not 25.
  The listing's own reply count is right; the row count is not.
- THE LISTING CANNOT NAME ANYONE. Each opener carries a count of the accounts in its thread but
  not their ids, and adding those counts across the 17 threads gives 25 - the number of replies,
  not the 15 distinct accounts behind them.
- THE OPENERS AND THE REPLIERS ARE NEARLY THE SAME PEOPLE. 21 accounts started a thread and 15
  replied; only 3 of the repliers never started one, and between them they account for 4 replies.

=== DECOYS ===
Every wrong method below was checked against gold and yields a different value.
- R1: count what the four room listings return -> 35 (gold 56)
- R1: count only the messages that started a thread -> 31 (gold 56)
- R1: add the listing rows to the rows the thread reads return -> 77 (gold 56)
- R2: count the rows the 17 thread reads return -> 42 (gold 25)
- R2: count the replies visible in the room listings -> 4 (gold 25)
- R2: count the threads instead of the replies -> 17 (gold 25)
- R3: count every message that started a thread -> 31 (gold 17)
- R3: count the listing rows that are not openers -> 4 (gold 17)
- R4: add up the accounts-in-thread counts on the listings -> 25 (gold 15)
- R4: count everybody who posted in the four rooms -> 24 (gold 15)
- R4: count the accounts visible in the four listings -> 22 (gold 15)
- R5: count the people rather than their replies -> 3 (gold 4)
- R5: count every reply -> 25 (gold 4)
- R6: answer in the final reply instead of posting -> no row (gold posted)

=== GOLD ===
(grader metadata, NOT shown to the agent. Derived against
scratch-pad/synthetic_connetor_design/Database/slack/synthetic_data.db, the corpus this image
serves with GYM_DATASET=synthetic, and re-verified through the served gym on port 8008 by
reading all four rooms and opening all 17 threads that report replies.)
Rooms: general-meshworks-security (CV22RIS8EUFS), security-095 (CRTSMZXIYU27),
security-v1-041 (C893RPE2V5HO), security-v3-065 (C279YYU33SGZ).
- messages_in_total = 56 (11 + 11 + 15 + 19)
- replies_in_total = 25
- threads_with_replies = 17 (2 + 2 + 6 + 7)
- people_who_replied = 15
- replies_from_outside_the_openers = 4, from 3 accounts
- self_replies = 5
Write gold: a message posted by UDV94ZXBF0PM into general-meshworks-security (CV22RIS8EUFS)
naming all four rooms with a TOTAL line.

=== SEED ===
Client query seed 9f6cbb34-6e3c-4872-8e2e-6509a54f0256, category slack_direct / scheduled-channel-reporting.
One task per seed; this seed is not reused."""
source_task_id = "9f6cbb34-6e3c-4872-8e2e-6509a54f0256"
